[package]
# the package needs to be named crypto_native to avoid collisions with "crypto"
name = "crypto_native"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
crypto = { path = "../../crypto", default-features = false, features = ["std"] }
ascon-hash256 = "0.1"
# The published ascon-aead128 0.1.x releases are not source-compatible with the
# stable ascon 0.5.0 API used by ascon-hash256. This revision builds against
# ascon 0.5 stable.
ascon-aead128 = { git = "https://github.com/RustCrypto/AEADs", rev = "f90367cf07286ab5db652970e8268fbeab62a682" }
aws-lc-rs = "1"
aes = "0.9"
aes-gcm = "0.11"
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", rev = "f3149ec5bb5449af877ba20377a11008ff499fa2" } # 1.8.7, matches stdx
chacha20 = "0.10"
chacha20poly1305 = "0.11"
cipher = "0.5"
ctr = "0.10"
ed25519-dalek = "2"
hmac = "0.13"
inout = "0.2"
ml-dsa = "0.1"
poly1305 = "0.9"
sha2 = "0.11"
sha3 = "0.11"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "aead"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "mac"
harness = false

[[bench]]
name = "signatures"
harness = false

[[bench]]
name = "stream_ciphers"
harness = false
